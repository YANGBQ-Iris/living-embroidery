<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#9fc4f7"><meta name="description" content="共生间隙：触碰植物，收藏一次相遇。"><title>Symbiotic Interlude · 共生间隙</title><link rel="preload" href="assets/sky-background.jpg" as="image"><link rel="stylesheet" href="src/style.css"><link rel="stylesheet" href="src/polish.css"><link rel="stylesheet" href="src/sound.css"><link rel="stylesheet" href="src/life.css"><link rel="stylesheet" href="src/presentation.css"><link rel="stylesheet" href="src/refinement.css"><link rel="stylesheet" href="src/experience.css"></head>
<body data-scene="welcome">
<main id="experience" aria-label="共生间隙互动花园">
 <section id="welcome" class="welcome"><p>共生间隙</p><h1>Symbiotic Interlude</h1><button id="start-experience" disabled>轻触，唤醒花园</button><small id="welcome-status" role="status">正在准备花园，请稍候…</small></section>
 <div id="landscape" aria-hidden="true"></div>
 <video id="scene-video" muted playsinline preload="metadata" poster="assets/poster-start.jpg"><source src="assets/intro.mp4" type="video/mp4"></video>
 <video id="ambient-video" muted playsinline loop preload="none" poster="assets/ambient-poster.jpg" aria-hidden="true"><source src="assets/ambient.mp4" type="video/mp4"></video>
 <div id="video-soften" aria-hidden="true"></div>
 <div id="intro-veil" aria-hidden="true"></div>
 <canvas id="atmosphere" aria-hidden="true"></canvas>
 <section id="arrival" class="arrival" aria-label="进入共生间隙" hidden>
  <p class="arrival-cn">共生间隙</p><h1><span>Symbiotic</span><em>Interlude</em></h1>
  <p class="arrival-copy">在万物之间，留一点温柔。</p><button id="enter" class="enter-button">轻触任意处，走进花园 <span>↗</span></button>
 </section>
 <section id="passage-copy" class="passage-copy" hidden><p>循着花的呼吸</p><button id="enter-garden" class="enter-button">轻触，抵达花园 <span>↗</span></button></section>
 <section id="garden" aria-label="选择你的植物" hidden>
  <div class="garden-heading"><p>每一次靠近，都有回响。</p><span>先轻触一株植物，再次轻触进入</span></div>
  <div id="plants" class="plants"></div>
  <div id="photo-garland" class="photo-garland" aria-label="空中的花笺" inert><img class="garland-rope" src="assets/garland.png" alt=""><div id="photo-hangers"></div></div>
  <button id="sky-invitation" class="sky-invitation" aria-label="向下滑动或点击展开照片花笺"><span>你的故事，藏在天空里</span><i>⌄</i></button>
  <div id="plant-caption" class="plant-caption" aria-live="polite"></div>
 </section>
 <section id="module" class="module" aria-label="植物互动" hidden></section>
 <div id="transition-veil" aria-hidden="true"></div>
</main>
<header id="chrome" class="chrome" hidden><button id="brand" aria-label="返回花园">Symbiotic <em>Interlude</em><small>共生间隙</small></button><nav aria-label="花园操作"><button id="photo-toggle">展开花笺</button><button id="finish" hidden>暂别花园</button><button id="motion-toggle" aria-pressed="false" title="切换轻量动效">轻量动效</button><button id="replay" title="重播开场">↺<span class="sr-only">重播开场</span></button></nav></header>
<button id="skip" class="skip">跳过序幕 <span>↗</span></button>
<button id="video-retry" class="video-retry" hidden>轻触播放</button>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="lightbox"><button id="close-lightbox" class="close-button" aria-label="关闭照片">×</button><img id="lightbox-image" alt=""><div id="lightbox-caption"></div><a id="lightbox-download" class="text-button" download="共生间隙.png">下载图片 ↗</a></dialog>
<noscript>请启用 JavaScript 以体验共生间隙。</noscript>
<script type="module" src="src/app.js"></script>
</body></html>
