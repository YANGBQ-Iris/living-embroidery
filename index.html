<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#9fc4f7"><meta name="description" content="生命绣谱：以植物为引，让生命的律动与苗绣纹样相遇。"><title>Living Embroidery · 生命绣谱</title><link rel="preload" href="assets/embroidered-garden.svg" as="image"><link rel="stylesheet" href="src/style.css"><link rel="stylesheet" href="src/polish.css"><link rel="stylesheet" href="src/sound.css"><link rel="stylesheet" href="src/life.css"><link rel="stylesheet" href="src/presentation.css"><link rel="stylesheet" href="src/refinement.css"><link rel="stylesheet" href="src/experience.css"><link rel="stylesheet" href="src/plant-studio.css"><link rel="stylesheet" href="src/sensors.css"><link rel="stylesheet" href="src/embroidery.css"><link rel="stylesheet" href="src/pattern-library.css"></head>
<body data-scene="welcome">
<main id="experience" aria-label="生命绣谱互动花园">
 <section id="welcome" class="welcome"><p>生命绣谱</p><h1>Living Embroidery</h1><button id="start-experience" disabled>轻触，唤醒生命的纹样</button><small id="welcome-status" role="status">正在准备花园，请稍候…</small></section>
 <div id="landscape" aria-hidden="true"></div>
 <video id="scene-video" muted playsinline preload="metadata" poster="assets/intro-embroidery-poster.jpg"><source src="assets/intro-embroidery.mp4" type="video/mp4"></video>
 <video id="ambient-video" muted playsinline loop preload="none" poster="assets/ambient-poster.jpg" aria-hidden="true"><source src="assets/ambient.mp4" type="video/mp4"></video>
 <div id="video-soften" aria-hidden="true"></div>
 <div id="intro-veil" aria-hidden="true"></div>
 <canvas id="atmosphere" aria-hidden="true"></canvas>
 <section id="arrival" class="arrival" aria-label="进入生命绣谱" hidden>
  <p class="arrival-cn">生命绣谱</p><h1><span>Living</span><em>Embroidery</em></h1>
  <p class="arrival-copy">一叶生，一纹起。</p><button id="enter" class="enter-button">轻触任意处，走进花园 <span>↗</span></button>
 </section>
 <section id="passage-copy" class="passage-copy" hidden><p>循着叶的呼吸，看纹样舒展</p><button id="enter-garden" class="enter-button">轻触，抵达花园 <span>↗</span></button></section>
 <section id="garden" aria-label="选择你的植物" hidden>
  <div class="garden-heading"><p>以植物为引，绣下生命的纹样。</p><span>先轻触选择植物，再轻触进入纹样互动</span></div>
  <div id="plants" class="plants"></div>
  <div id="photo-garland" class="photo-garland" aria-label="空中的花笺" inert><img class="garland-rope" src="assets/embroidered-garland.svg" alt=""><div id="photo-hangers"></div></div>
  <button id="sky-invitation" class="sky-invitation" aria-label="向下滑动或点击展开照片花笺"><span>把生长与纹样，留在天空里</span><i>⌄</i></button>
  <div id="plant-caption" class="plant-caption" aria-live="polite"></div>
 </section>
 <section id="module" class="module" aria-label="植物互动" hidden></section>
 <div id="transition-veil" aria-hidden="true"></div>
</main>
<header id="chrome" class="chrome" hidden><button id="brand" aria-label="返回花园">Living <em>Embroidery</em><small>生命绣谱</small></button><nav aria-label="花园操作"><button id="photo-toggle">展开花笺</button><button id="finish" hidden>暂别花园</button><button id="motion-toggle" aria-pressed="false" title="切换轻量动效">轻量动效</button><button id="replay" title="重播开场">↺<span class="sr-only">重播开场</span></button></nav></header>
<button id="skip" class="skip">跳过序幕 <span>↗</span></button>
<button id="video-retry" class="video-retry" hidden>轻触播放</button>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="lightbox"><button id="close-lightbox" class="close-button" aria-label="关闭照片">×</button><img id="lightbox-image" alt=""><div id="lightbox-caption"></div><a id="lightbox-download" class="text-button" download="生命绣谱.png">下载图片 ↗</a></dialog>
<noscript>请启用 JavaScript 以体验生命绣谱。</noscript>
<script src="src/vendor/gsap.min.js"></script>
<script src="src/vendor/ScrollTrigger.min.js"></script>
<script type="module" src="src/app.js"></script>
</body></html>
